<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR diagram</title>
<style>
  @font-face {
    font-family: "Virgil";
    src: url("https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Virgil.woff2") format("woff2");
    font-display: block;
  }
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; width: 100vw; height: 100vh; }
  text { font-family: "Virgil", "Comic Sans MS", cursive; fill: #1e1e1e; }
</style>
</head>
<body>
<svg id="diagram"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script>
// The drawing. Change WIDTH, HEIGHT and SHAPES, then take a screenshot of this page
// in a window of WIDTH by HEIGHT. This example shows one caller that had two paths
// to a store and now has one.
const WIDTH = 1200;
const HEIGHT = 420;

// Kinds: box, chip, frame, gone, arrow, label, note. Text does not wrap.
// Fills: blue, green, violet, yellow, red, gray.
const SHAPES = [
  { kind: "frame", x: 20, y: 20, w: 560, h: 380, title: "before" },
  { kind: "box", x: 60, y: 90, w: 180, h: 80, fill: "gray", title: "caller" },
  { kind: "box", x: 340, y: 80, w: 200, h: 70, fill: "red", title: "old path" },
  { kind: "box", x: 340, y: 180, w: 200, h: 70, fill: "red", title: "second path" },
  { kind: "box", x: 200, y: 290, w: 200, h: 80, fill: "gray", title: "store" },
  { kind: "arrow", from: [240, 120], to: [340, 115] },
  { kind: "arrow", from: [240, 145], to: [340, 210] },
  { kind: "arrow", from: [440, 250], to: [340, 290] },
  { kind: "note", x: 150, y: 260, text: "two ways in" },

  { kind: "frame", x: 620, y: 20, w: 560, h: 380, title: "now" },
  { kind: "box", x: 660, y: 90, w: 180, h: 80, fill: "gray", title: "caller" },
  { kind: "box", x: 940, y: 90, w: 200, h: 80, fill: "green", title: "one path", lines: ["checks the input"] },
  { kind: "box", x: 940, y: 290, w: 200, h: 80, fill: "gray", title: "store" },
  { kind: "arrow", from: [840, 130], to: [940, 130] },
  { kind: "arrow", from: [1040, 170], to: [1040, 290] },
  { kind: "gone", x: 660, y: 310, w: 200, h: 46, text: "second path" },
];

const COLORS = { blue: "#a5d8ff", green: "#b2f2bb", violet: "#d0bfff", yellow: "#ffec99", red: "#ffc9c9", gray: "#e9ecef" };
const INK = "#1e1e1e";
const NOTE_RED = "#e03131";
const SVG_NS = "http://www.w3.org/2000/svg";

// A fixed seed draws the same wobble on every run.
function roughOptions(fill, seed) {
  return { seed: seed, roughness: 1.2, bowing: 1, stroke: INK, strokeWidth: 1.6, fill: fill, fillStyle: "hachure", hachureGap: 7, fillWeight: 1.1 };
}

function addText(svg, x, y, text, size, color) {
  const node = document.createElementNS(SVG_NS, "text");
  node.setAttribute("x", String(x));
  node.setAttribute("y", String(y));
  node.setAttribute("text-anchor", "middle");
  node.setAttribute("font-size", String(size));
  if (color !== undefined) {
    node.setAttribute("style", `fill: ${color}`);
  }
  node.textContent = text;
  svg.appendChild(node);
}

function drawBox(svg, rc, shape, seed) {
  svg.appendChild(rc.rectangle(shape.x, shape.y, shape.w, shape.h, roughOptions(COLORS[shape.fill], seed)));
  const lines = shape.lines ?? [];
  const centreX = shape.x + shape.w / 2;
  const lineHeight = 24;
  const blockHeight = 28 + lines.length * lineHeight;
  let y = shape.y + (shape.h - blockHeight) / 2 + 24;
  addText(svg, centreX, y, shape.title, 24);
  for (const line of lines) {
    y += lineHeight;
    addText(svg, centreX, y, line, 17);
  }
}

function drawChip(svg, rc, shape, seed) {
  svg.appendChild(rc.rectangle(shape.x, shape.y, shape.w, shape.h, roughOptions(COLORS[shape.fill], seed)));
  addText(svg, shape.x + shape.w / 2, shape.y + shape.h / 2 + 7, shape.text, 19);
}

function drawFrame(svg, rc, shape, seed) {
  const options = roughOptions(undefined, seed);
  options.strokeLineDash = [10, 8];
  options.strokeWidth = 1.3;
  svg.appendChild(rc.rectangle(shape.x, shape.y, shape.w, shape.h, options));
  addText(svg, shape.x + shape.w / 2, shape.y + 34, shape.title, 22);
}

// A deleted part: a gray box struck through with two red lines.
function drawGone(svg, rc, shape, seed) {
  svg.appendChild(rc.rectangle(shape.x, shape.y, shape.w, shape.h, roughOptions(COLORS.gray, seed)));
  addText(svg, shape.x + shape.w / 2, shape.y + shape.h / 2 + 6, shape.text, 18, "#495057");
  const strike = { seed: seed + 1, roughness: 1.4, stroke: NOTE_RED, strokeWidth: 2.4 };
  svg.appendChild(rc.line(shape.x - 6, shape.y + 6, shape.x + shape.w + 6, shape.y + shape.h - 6, strike));
  svg.appendChild(rc.line(shape.x - 6, shape.y + shape.h - 6, shape.x + shape.w + 6, shape.y + 6, strike));
}

// The arrow bends through a point pushed sideways from the middle of the line.
function drawArrow(svg, rc, shape, seed) {
  const [x1, y1] = shape.from;
  const [x2, y2] = shape.to;
  const bend = shape.bend ?? 0;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const length = Math.hypot(dx, dy);
  const midX = (x1 + x2) / 2 - (dy / length) * bend;
  const midY = (y1 + y2) / 2 + (dx / length) * bend;
  const options = { seed: seed, roughness: 1, bowing: 0.6, stroke: INK, strokeWidth: 1.8 };
  svg.appendChild(rc.curve([[x1, y1], [midX, midY], [x2, y2]], options));
  const angle = Math.atan2(y2 - midY, x2 - midX);
  for (const side of [-1, 1]) {
    const headAngle = angle + Math.PI + side * 0.45;
    svg.appendChild(rc.line(x2, y2, x2 + Math.cos(headAngle) * 16, y2 + Math.sin(headAngle) * 16, options));
  }
  if (shape.label !== undefined) {
    addText(svg, shape.labelAt[0], shape.labelAt[1], shape.label, 17, "#495057");
  }
}

const DRAWERS = {
  box: drawBox,
  chip: drawChip,
  frame: drawFrame,
  gone: drawGone,
  arrow: drawArrow,
  label: (svg, rc, shape) => addText(svg, shape.x, shape.y, shape.text, shape.size ?? 19, "#495057"),
  note: (svg, rc, shape) => addText(svg, shape.x, shape.y, shape.text, 21, NOTE_RED),
};

// The font must load before the drawing, or the labels use the fallback font.
document.fonts.load('20px "Virgil"').then(() => {
  const svg = document.getElementById("diagram");
  svg.setAttribute("viewBox", `0 0 ${WIDTH} ${HEIGHT}`);
  const rc = rough.svg(svg);
  let seed = 1;
  for (const shape of SHAPES) {
    DRAWERS[shape.kind](svg, rc, shape, seed);
    seed += 3;
  }
});
</script>
</body>
</html>
