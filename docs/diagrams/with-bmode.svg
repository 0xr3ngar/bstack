    <text x="89" y="331" text-anchor="middle" font-size="15" font-weight="bold">Council</text>
    <text x="146" y="331" font-size="16">Review the diff. Send defects back through the lead.</text>
    <circle cx="30" cy="368" r="5" fill="#656d75"/>
