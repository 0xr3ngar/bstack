<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 420" role="img">
  <title>With /bmode. Same feature request. You can leave the thread.</title>
  <rect width="610" height="420" rx="12" fill="#fbfaf7"/>
  <g fill="#202a32" font-family="Arial, sans-serif">
