    <text x="89" y="136" text-anchor="middle" font-size="15" font-weight="bold">Lead</text>
    <text x="146" y="136" font-size="16">Find the filter logic and propose an export plan.</text>
    <circle cx="30" cy="173" r="5" fill="#656d75"/>
    <rect x="48" y="155" width="83" height="30" rx="6" fill="#e1daf7"/>
    <text x="89" y="175" text-anchor="middle" font-size="15" font-weight="bold">Council</text>
    <text x="146" y="175" font-size="16">Review it in parallel. One reviewer flags CSV escaping.</text>
    <circle cx="30" cy="212" r="5" fill="#656d75"/>
    <rect x="48" y="194" width="83" height="30" rx="6" fill="#d9e8fa"/>
    <text x="89" y="214" text-anchor="middle" font-size="15" font-weight="bold">Lead</text>
    <text x="146" y="214" font-size="16">Check the objection and send the revised plan back.</text>
    <circle cx="30" cy="251" r="5" fill="#656d75"/>
    <rect x="48" y="233" width="83" height="30" rx="6" fill="#e1daf7"/>
    <text x="89" y="253" text-anchor="middle" font-size="15" font-weight="bold">Council</text>
    <text x="146" y="253" font-size="16">Read the revision and the earlier findings.</text>
    <circle cx="30" cy="290" r="5" fill="#656d75"/>
    <rect x="48" y="272" width="83" height="30" rx="6" fill="#d3ecdf"/>
    <text x="89" y="292" text-anchor="middle" font-size="15" font-weight="bold">Builders</text>
