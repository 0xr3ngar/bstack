    <text x="24" y="58" font-size="17">Same feature request. You can leave the thread.</text>
    <path d="M 30 95 V 368" stroke="#a3abb2" stroke-width="2"/>
    <circle cx="30" cy="95" r="5" fill="#656d75"/>
