<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 654" role="img">
  <title>Before. You carry the implementation between messages.</title>
  <rect width="610" height="654" rx="12" fill="#fbfaf7"/>
  <g fill="#202a32" font-family="Arial, sans-serif">
    <text x="24" y="33" font-size="23" font-weight="bold">Before</text>
    <text x="24" y="58" font-size="17">You carry the implementation between messages.</text>
    <path d="M 30 95 V 602" stroke="#a3abb2" stroke-width="2"/>
    <circle cx="30" cy="95" r="5" fill="#656d75"/>
    <rect x="48" y="77" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="97" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="97" font-size="16">Ask for a CSV export of the filtered table.</text>
    <circle cx="30" cy="134" r="5" fill="#656d75"/>
    <rect x="48" y="116" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="136" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="136" font-size="16">Point to the table code and list the columns.</text>
    <circle cx="30" cy="173" r="5" fill="#656d75"/>
    <rect x="48" y="155" width="83" height="30" rx="6" fill="#d3ecdf"/>
    <text x="89" y="175" text-anchor="middle" font-size="15" font-weight="bold">Clanker</text>
    <text x="146" y="175" font-size="16">Propose a way to serialize the rows.</text>
    <circle cx="30" cy="212" r="5" fill="#656d75"/>
    <rect x="48" y="194" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="214" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="214" font-size="16">Read the proposal and say to start.</text>
    <circle cx="30" cy="251" r="5" fill="#656d75"/>
    <rect x="48" y="233" width="83" height="30" rx="6" fill="#d3ecdf"/>
    <text x="89" y="253" text-anchor="middle" font-size="15" font-weight="bold">Clanker</text>
    <text x="146" y="253" font-size="16">Implement the download button and exporter.</text>
    <circle cx="30" cy="290" r="5" fill="#656d75"/>
    <rect x="48" y="272" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="292" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="292" font-size="16">Try it. Notice it exports unfiltered rows.</text>
    <circle cx="30" cy="329" r="5" fill="#656d75"/>
    <rect x="48" y="311" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="331" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="331" font-size="16">Find the filter logic and ask for the fix.</text>
    <circle cx="30" cy="368" r="5" fill="#656d75"/>
    <rect x="48" y="350" width="83" height="30" rx="6" fill="#d3ecdf"/>
    <text x="89" y="370" text-anchor="middle" font-size="15" font-weight="bold">Clanker</text>
    <text x="146" y="370" font-size="16">Change the query and show the patch.</text>
    <circle cx="30" cy="407" r="5" fill="#656d75"/>
    <rect x="48" y="389" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="409" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="409" font-size="16">Ask it to exercise the filtered export.</text>
    <circle cx="30" cy="446" r="5" fill="#656d75"/>
    <rect x="48" y="428" width="83" height="30" rx="6" fill="#d3ecdf"/>
    <text x="89" y="448" text-anchor="middle" font-size="15" font-weight="bold">Clanker</text>
    <text x="146" y="448" font-size="16">Run the case and report the result.</text>
    <circle cx="30" cy="485" r="5" fill="#656d75"/>
    <rect x="48" y="467" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="487" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="487" font-size="16">Ask about commas and quotes in cell values.</text>
    <circle cx="30" cy="524" r="5" fill="#656d75"/>
    <rect x="48" y="506" width="83" height="30" rx="6" fill="#d3ecdf"/>
    <text x="89" y="526" text-anchor="middle" font-size="15" font-weight="bold">Clanker</text>
    <text x="146" y="526" font-size="16">Add an escaping test and run the checks.</text>
    <circle cx="30" cy="563" r="5" fill="#656d75"/>
    <rect x="48" y="545" width="83" height="30" rx="6" fill="#ffe5a2"/>
    <text x="89" y="565" text-anchor="middle" font-size="15" font-weight="bold">You</text>
    <text x="146" y="565" font-size="16">Review the diff and ask it to open a PR.</text>
    <circle cx="30" cy="602" r="5" fill="#656d75"/>
    <rect x="48" y="584" width="83" height="30" rx="6" fill="#d3ecdf"/>
    <text x="89" y="604" text-anchor="middle" font-size="15" font-weight="bold">Clanker</text>
    <text x="146" y="604" font-size="16">Open the draft PR.</text>
  </g>
</svg>
